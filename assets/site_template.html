<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Explorer</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b7078; --line: #e3e4e6;
  --accent: #3257d6; --accent-soft: #e9eeff; --code-bg: #f4f5f7; --hl: #fff3bf;
  --ok: #1a7f4b; --ok-bg: #e2f5ea; --warn: #9a6200; --warn-bg: #fff1d0;
  --unk: #5f6570; --unk-bg: #eceef1; --err: #b3261e; --err-bg: #fde7e5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1c1f23; --ink: #e6e7e9; --muted: #9299a3; --line: #2c3036;
    --accent: #8ea6ff; --accent-soft: #232b47; --code-bg: #22262b; --hl: #4a4116;
    --ok: #6fd39a; --ok-bg: #173324; --warn: #f0c060; --warn-bg: #3a2e12;
    --unk: #a5acb6; --unk-bg: #2a2e34; --err: #ff8a80; --err-bg: #3d1c1a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 48px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
header .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav a { padding: 6px 11px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
nav a:hover { text-decoration: none; color: var(--ink); }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.search { margin-left: auto; position: relative; flex: 0 1 300px; min-width: 120px; }
.search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.results { position: absolute; top: 36px; right: 0; width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); z-index: 30; }
.results a { display: block; padding: 7px 12px; color: var(--ink); border-bottom: 1px solid var(--line); }
.results a:hover { background: var(--accent-soft); text-decoration: none; }
.results small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.body { flex: 1; display: flex; min-height: 0; }
aside { width: 290px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 10px 6px; background: var(--panel); }
aside:empty { display: none; }
main { flex: 1; overflow: auto; padding: 24px 32px 80px; min-width: 0; }
main > * { max-width: 920px; }
main > .wide { max-width: none; }
h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.3; overflow-wrap: anywhere; }
h2 { font-size: 15px; margin: 30px 0 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
h3 { font-size: 14.5px; margin: 0 0 4px; overflow-wrap: anywhere; }
p { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.sub { color: var(--muted); margin-bottom: 12px; overflow-wrap: anywhere; }
.lead { font-size: 15.5px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px 14px; margin: 8px 0; }
.claim { padding: 7px 0; border-bottom: 1px dashed var(--line); }
.claim:last-child { border-bottom: 0; }
.badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 0 7px; border-radius: 10px; margin-right: 6px; vertical-align: 1px; line-height: 18px; }
.badge.confirmed { color: var(--ok); background: var(--ok-bg); }
.badge.inferred { color: var(--warn); background: var(--warn-bg); }
.badge.unknown { color: var(--unk); background: var(--unk-bg); }
.badge.method { color: var(--accent); background: var(--accent-soft); font-family: ui-monospace, Menlo, monospace; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 5px; }
.chips .sub { margin: 0; }
.card.method { margin-left: 22px; max-width: 898px; }
.chip { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--code-bg); color: var(--ink); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.chip.sym { background: var(--accent-soft); border-color: transparent; }
.tree div.row, .list a { display: block; padding: 3px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.tree div.row:hover, .list a:hover { background: var(--code-bg); text-decoration: none; }
.tree .on, .list a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tree .kids { margin-left: 13px; border-left: 1px solid var(--line); padding-left: 3px; }
.tree .dim { color: var(--muted); }
.tree .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-left: 6px; vertical-align: 2px; }
.list a small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; }
.sig { background: var(--code-bg); padding: 6px 9px; border-radius: 6px; overflow-x: auto; white-space: pre; margin: 6px 0; }
table { border-collapse: collapse; width: 100%; margin: 6px 0; }
th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; background: var(--panel); min-width: 110px; }
.stat b { display: block; font-size: 19px; }
.stat span { color: var(--muted); font-size: 12px; }
.steps { position: relative; margin-left: 13px; border-left: 2px solid var(--line); padding-left: 24px; }
.step { position: relative; }
.step > .num { position: absolute; left: -38px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 650; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.branch { margin: 8px 0 0; padding: 6px 10px; border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 6px 6px 0; }
.note { padding: 8px 12px; border-radius: 6px; margin: 8px 0; }
.note.err { background: var(--err-bg); color: var(--err); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.info { background: var(--unk-bg); color: var(--unk); }
.graph { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.graph svg { display: block; margin: 0 auto; }
.graph .node rect { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; rx: 8; cursor: pointer; }
.graph .node:hover rect, .graph .node.on rect { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.graph .node text { fill: var(--ink); font-size: 13px; font-weight: 600; pointer-events: none; }
.graph .node text.small { fill: var(--muted); font-size: 11px; font-weight: 400; }
.graph path.edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.graph path.edge.inferred { stroke-dasharray: 5 4; }
.graph text.elabel { fill: var(--muted); font-size: 10.5px; text-anchor: middle; stroke: var(--panel); stroke-width: 5px; paint-order: stroke; stroke-linejoin: round; }
.graph marker path { fill: var(--muted); }
#src { position: fixed; top: 48px; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.16); display: none; flex-direction: column; z-index: 20; }
#src.open { display: flex; }
#src .bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
#src .bar .mono { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#src .bar button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
#src .code { flex: 1; overflow: auto; padding: 8px 0; }
#src .ln { display: flex; white-space: pre; }
#src .ln i { flex: none; width: 54px; text-align: right; padding-right: 14px; color: var(--muted); font-style: normal; user-select: none; }
#src .ln.hl { background: var(--hl); }
.legend { color: var(--muted); font-size: 12px; margin: 8px 0; }
@media (max-width: 760px) {
  .body { flex-direction: column; }
  aside { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px 16px 60px; }
  header { gap: 8px; padding: 0 10px; }
  header .name { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="name" id="repo"></div>
  <nav id="nav"></nav>
  <div class="search"><input id="q" placeholder="Search files, symbols, endpoints, flows" autocomplete="off"><div class="results" id="results" hidden></div></div>
</header>
<div class="body"><aside id="side"></aside><main id="main"></main></div>
<div id="src"><div class="bar"><span class="mono" id="srcTitle"></span><a id="srcDoc">open doc</a><button id="srcClose">Close</button></div><div class="code mono" id="srcCode"></div></div>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const M = DATA.manifest, G = DATA.graph, D = DATA.docs, SRC = DATA.sources || {};
const MODS = G.modules || {}, ROUTES = G.routes || [], MODELS = G.models || [];
const FLOWS = (D.flows && D.flows.flows) || [];
const ARCH = D.architecture || {}, OV = D.overview || {};
const API_DOC = {}; ((D.api && D.api.endpoints) || []).forEach(e => API_DOC[e.id] = e);
const ROUTE_IDS = new Set(ROUTES.map(r => r.id));
const EXTRA_ENDPOINTS = ((D.api && D.api.endpoints) || []).filter(e => !ROUTE_IDS.has(e.id));

// ---------- i18n: Chinese by default, English when built with --lang en ----------
const LANG = DATA.lang === "en" ? "en" : "zh";
const ZH = {
 "No overview has been written yet (docs/overview.json).": "还没有写总览（docs/overview.json）。",
 "code files": "代码文件",
 "lines of code": "代码行数",
 "files explained": "已讲解文件",
 "endpoints": "接口",
 "flows traced": "已追踪流程",
 "cited lines or parser output support it  ": "引用的源码行或解析器输出可直接证明  ",
 "a reading of the code, not proven  ": "对代码的合理解读，未被直接证明  ",
 "not enough evidence": "证据不足",
 "Scope: ": "范围：",
 "Start here": "从这里开始",
 "Tech stack": "技术栈",
 "Entry points": "入口",
 "Open questions": "未解问题",
 "Languages": "语言分布",
 "Language": "语言",
 "Files": "文件数",
 "Lines": "行数",
 "Verification": "校验",
 "This site was built without a validation report. References have not been checked.": "本站点构建时没有校验报告，引用尚未检查。",
 "All evidence references were checked against the source: every cited file exists, every line range is inside its file, every quoted snippet was found.": "所有证据引用都已对照源码检查：引用的文件都存在，行号范围都在文件内，引用的片段都能找到。",
 " reference errors remain. Claims below may point at the wrong code.": " 处引用错误尚未修复，下面的说明可能指向了错误的代码。",
 "Coverage": "覆盖项",
 "Documented": "已讲解",
 "In scope": "范围内总数",
 "claims": "论断",
 " confirmed, ": " 条已确认，",
 " inferred, ": " 条推断，",
 " unknown; ": " 条未知；",
 " evidence references checked": " 处证据引用已检查",
 "Not scanned": "未扫描",
 "explained": "已讲解",
 "Code": "代码",
 "Pick a file in the tree. A green dot marks files that have an explanation.": "在左侧文件树中选择文件。绿点表示该文件已有讲解。",
 "This file is not in the scanned repository.": "这个文件不在已扫描的仓库中。",
 " lines · ": " 行 · ",
 "view source": "查看源码",
 "No explanation was written for this file.": "这个文件还没有讲解。",
 " The structure below comes from the parser.": "下面的结构来自解析器。",
 "component: ": "组件：",
 "Parser error: ": "解析错误：",
 "Responsibilities": "职责",
 "Used in flows": "所在流程",
 "  step ": "  第 ",
 "Classes and functions": "类与函数",
 "calls": "调用",
 "called by": "被调用",
 "Notes": "备注",
 "Imports from this repository": "引用的仓库内文件",
 "Imported by": "被这些文件引用",
 "Related": "相关文件",
 "“calls” and “called by” come from static name resolution. Dynamic dispatch, dependency injection and reflection are not visible to it, so the lists can be incomplete.": "“调用”和“被调用”来自静态名称解析，看不到动态分发、依赖注入和反射，所以列表可能不完整。",
 "Architecture": "架构",
 "No architecture has been written yet (docs/architecture.json).": "还没有写架构（docs/architecture.json）。",
 " path": " 个路径",
 " paths": " 个路径",
 "Click a component. Dashed arrows are inferred relationships.": "点击组件查看详情。虚线箭头表示推断出的关系。",
 "Relationships of ": "相关依赖：",
 "Flows through ": "经过的流程：",
 "All relationships": "全部依赖关系",
 "API": "接口",
 "No HTTP endpoints were extracted or described. Route extraction covers FastAPI and Flask style decorators; other frameworks need entries in docs/api.json.": "没有提取或描述任何 HTTP 接口。路由提取只支持 FastAPI 和 Flask 风格的装饰器，其他框架需要在 docs/api.json 中补充。",
 "Field": "字段",
 "Type": "类型",
 "Default": "默认值",
 "required": "必填",
 "handler ": "处理函数 ",
 " · extracted by the parser": " · 由解析器提取",
 "described from source, not extracted by the parser": "根据源码描述，非解析器提取",
 "The router prefix could not be traced to an application object, so the full path may be missing a prefix.": "路由前缀无法追溯到应用对象，完整路径可能缺少前缀。",
 "Handler parameters": "处理函数参数",
 "Name": "名称",
 "Default / source": "默认值 / 来源",
 "Response": "响应",
 "return annotation": "返回类型标注",
 "Authentication": "认证",
 "Errors": "错误",
 "Flows that start or pass here": "从这里开始或经过这里的流程",
 "Flows": "流程",
 "No flows have been traced yet (docs/flows.json).": "还没有追踪任何流程（docs/flows.json）。",
 " steps": " 步",
 "Trigger: ": "触发：",
 "Steps": "步骤",
 "Gaps and unknowns": "缺口与未知",
 "Source text is not embedded for this file. Open ": "这个文件的源码没有内嵌。请在编辑器中打开 ",
 " at line ": " 第 ",
 " in your editor.": "。",
 "No matches": "没有匹配结果",
 "Overview": "总览",
 "open": "打开",
 "open doc": "打开讲解",
 "Close": "关闭",
 "Search files, symbols, endpoints, flows": "搜索文件、符号、接口、流程",
 "confirmed": "已确认",
 "inferred": "推断",
 "unknown": "未知",
 "Supported directly by the cited source lines or by parser output": "引用的源码行或解析器输出可直接证明",
 "A reasoned reading of the code that the cited lines do not prove on their own": "对代码的合理解读，引用的源码行本身不足以证明",
 "The available evidence is not enough to say": "现有证据不足以下结论",
 "files": "文件",
 "public symbols": "公开符号",
 "routes": "路由",
 "file": "文件",
 "endpoint": "接口",
 "flow": "流程",
 "flow step": "流程步骤",
 "component": "组件",
 "class": "类",
 "method": "方法",
 "function": "函数",
 "dependency or build directory": "依赖或构建目录",
 "possible secret": "疑似密钥文件",
 "generated or lock file": "生成文件或锁文件",
 "binary": "二进制文件",
 "__step_suffix": " 步：",
 "__line_suffix": " 行"
};
const T = s => (LANG === "zh" && Object.prototype.hasOwnProperty.call(ZH, s)) ? ZH[s] : s;
// Suffixes that only exist in Chinese ("第 3 步：", "第 12 行"); English keeps its own punctuation.
const STEP_SUFFIX = LANG === "zh" ? "__step_suffix" : ": ";
const LINE_SUFFIX = LANG === "zh" ? "__line_suffix" : "";

// ---------- tiny DOM helpers (text is always inserted as text nodes) ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function rich(text) { // `code` spans only; everything else stays plain text
  return String(text == null ? "" : text).split("`").map((part, i) => i % 2 ? h("code", null, part) : part);
}
const P = (text, cls) => h("p", { class: cls }, rich(text));
const badge = s => s ? h("span", { class: "badge " + s, title: T(STATUS_HELP[s] || "") }, T(s)) : null;
const STATUS_HELP = {
  confirmed: "Supported directly by the cited source lines or by parser output",
  inferred: "A reasoned reading of the code that the cited lines do not prove on their own",
  unknown: "The available evidence is not enough to say"
};
const enc = encodeURIComponent;
const fileLink = (p, label) => h("a", { href: "#/code/" + enc(p), class: "mono" }, label || p);

function evChip(ev) {
  const label = ev.file + (ev.lines ? ":" + ev.lines[0] + (ev.lines[1] !== ev.lines[0] ? "–" + ev.lines[1] : "") : "");
  return h("a", { class: "chip", title: ev.quote || label, onclick: () => openSource(ev.file, ev.lines && ev.lines[0], ev.lines && ev.lines[1]) }, label);
}
function symChip(ref) {
  const [file, q] = ref.split("::");
  const s = q && MODS[file] && MODS[file].symbols.find(x => x.qualname === q);
  return h("a", { class: "chip sym", title: ref, onclick: () => s ? openSource(file, s.line_start, s.line_end) : go("#/code/" + enc(file)) }, (q || file) + (q && /^[a-z_]/.test(q.split(".").pop()) ? "()" : ""));
}
function chips(evidence, symbols) {
  const items = [].concat((symbols || []).map(symChip), (evidence || []).map(evChip));
  return items.length ? h("div", { class: "chips" }, items) : null;
}
function claim(c) {
  if (typeof c === "string") return h("div", { class: "claim" }, P(c));
  return h("div", { class: "claim" }, h("p", null, badge(c.status), rich(c.text || c.summary || "")), chips(c.evidence, c.symbols));
}
function section(title, items, render) {
  if (!items || !items.length) return null;
  return [h("h2", null, title), h("div", { class: "card" }, items.map(render || claim))];
}

// ---------- reverse indexes that connect the three views ----------
const importedBy = {}, calledBy = {}, flowsByFile = {}, compByFile = {};
(G.import_edges || []).forEach(e => (importedBy[e.to] = importedBy[e.to] || []).push(e.from));
for (const p in MODS) for (const s of MODS[p].symbols) for (const c of (s.calls || [])) {
  if (c.resolved && c.resolved.includes("::")) (calledBy[c.resolved] = calledBy[c.resolved] || new Set()).add(p + "::" + s.qualname);
}
FLOWS.forEach(f => (f.steps || []).forEach((st, i) => {
  const files = new Set([].concat((st.evidence || []).map(e => e.file), (st.symbols || []).map(r => r.split("::")[0])));
  files.forEach(file => (flowsByFile[file] = flowsByFile[file] || []).push({ flow: f, step: st, n: i + 1 }));
}));
(ARCH.components || []).forEach(c => (c.files || []).forEach(f => {
  M.files.forEach(x => { if (x.path === f || x.path.startsWith(f.replace(/\/$/, "") + "/")) (compByFile[x.path] = compByFile[x.path] || []).push(c); });
}));

// ---------- views ----------
const side = document.getElementById("side"), main = document.getElementById("main");

function viewOverview() {
  side.replaceChildren();
  const v = DATA.validation, s = M.stats, cov = v && v.coverage;
  const stat = (n, label) => h("div", { class: "stat" }, h("b", null, n), h("span", null, label));
  main.replaceChildren(...[
    h("h1", null, OV.name || M.repo_name),
    OV.summary ? P(OV.summary, "lead") : h("div", { class: "note info" }, T("No overview has been written yet (docs/overview.json).")),
    h("div", { class: "stats" },
      stat(s.code_files, T("code files")), stat(s.code_lines.toLocaleString(), T("lines of code")),
      stat(Object.keys(D.modules).length, T("files explained")), stat(ROUTES.length + EXTRA_ENDPOINTS.length, T("endpoints")), stat(FLOWS.length, T("flows traced"))),

ROUTES.forEach(r => INDEX.push({ t: r.id, k: "endpoint", s: (API_DOC[r.id] || {}).summary || r.handler, go: "#/api/" + enc(r.id) }));
EXTRA_ENDPOINTS.forEach(e => INDEX.push({ t: e.id, k: "endpoint", s: e.summary || "", go: "#/api/" + enc(e.id) }));
FLOWS.forEach(f => { INDEX.push({ t: f.title, k: "flow", s: f.summary || "", go: "#/flows/" + enc(f.id) }); (f.steps || []).forEach(st => INDEX.push({ t: st.title || "", k: "flow step", s: f.title, go: "#/flows/" + enc(f.id) })); });
(ARCH.components || []).forEach(c => INDEX.push({ t: c.name, k: "component", s: c.description || "", go: "#/arch/" + enc(c.id) }));
const q = document.getElementById("q"), results = document.getElementById("results");
q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  if (term.length < 2) { results.hidden = true; return; }
  const hits = INDEX.filter(x => x.t.toLowerCase().includes(term)).concat(INDEX.filter(x => !x.t.toLowerCase().includes(term) && x.s.toLowerCase().includes(term))).slice(0, 40);
  results.replaceChildren(...(hits.length ? hits.map(x => h("a", { onclick: () => { results.hidden = true; go(x.go); if (x.sym) setTimeout(() => { const el = document.getElementById("sym-" + x.sym); el && el.scrollIntoView({ block: "start" }); }, 0); } }, x.t, h("small", null, T(x.k) + (x.s ? " · " + x.s : "")))) : [h("a", null, T("No matches"))]));
  results.hidden = false;
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

// ---------- routing ----------
const TABS = [["overview", T("Overview"), viewOverview], ["code", T("Code"), viewCode], ["arch", T("Architecture"), viewArch], ["api", T("API"), viewApi], ["flows", T("Flows"), viewFlows]];
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  const m = location.hash.match(/^#\/([a-z]+)(?:\/(.*))?$/) || [null, "overview"];
  const tab = TABS.find(t => t[0] === m[1]) || TABS[0];
  document.getElementById("nav").replaceChildren(...TABS.map(t => h("a", { href: "#/" + t[0], class: t === tab ? "on" : "" }, t[1])));
  tab[2](m[2] ? decodeURIComponent(m[2]) : undefined);
  main.scrollTop = 0;
}
document.getElementById("repo").textContent = OV.name || M.repo_name;
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
q.placeholder = T("Search files, symbols, endpoints, flows");
document.getElementById("srcDoc").textContent = T("open doc");
document.getElementById("srcClose").textContent = T("Close");
document.title = (OV.name || M.repo_name) + " · Codebase Explorer";
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
